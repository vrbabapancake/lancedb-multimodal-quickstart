name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run against the newest lancedb release, to catch docs drift.
    - cron: "17 9 * * 1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, lancedb ${{ matrix.lancedb }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        lancedb: [pinned]
        include:
          - { os: macos-latest, python: "3.12", lancedb: pinned }
          - { os: ubuntu-latest, python: "3.12", lancedb: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ "${{ matrix.lancedb }}" = "latest" ]; then pip install --upgrade lancedb; fi
          python -c "import lancedb; print('lancedb', lancedb.__version__)"
      - name: Lint
        run: ruff check .
      - name: Run tests (examples and every code block in docs/quickstart.md)
        run: pytest -v
      - name: Run the example script
        run: python examples/image_search.py
      - name: Upload results picture
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest' && matrix.lancedb == 'pinned'
        uses: actions/upload-artifact@v4
        with:
          name: results-picture
          path: data/results.png

  agent-eval-probes:
    name: Agent-eval probes (clean install, as the published quickstart says)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # to commit refreshed results back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly what the published quickstart says
        run: |
          python -m pip install --upgrade pip
          pip install lancedb
      - name: Run probes
        run: |
          python eval/run_probes.py
          cat eval/results.md
      - name: Publish results to the job summary
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Render the example's results picture for the README
        run: |
          pip install pillow scikit-learn
          python examples/image_search.py
          mkdir -p docs/images && cp data/results.png docs/images/results.png
      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: |
            eval/results.md
            eval/results.json
      - name: Commit refreshed results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results.md docs/images/results.png
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "Refresh probe results and results picture [skip ci]"
            git push
          fi
