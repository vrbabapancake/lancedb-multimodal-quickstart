[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Fail on deprecated LanceDB calls, so the docs never teach one.
    'error:The create_index\(\) API:DeprecationWarning',
    'error:.* is deprecated as of:DeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["digits_data", "image_search"]
