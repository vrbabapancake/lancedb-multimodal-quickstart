[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Fail on LanceDB's deprecated create_index form, so the docs never teach it.
    'error:The create_index\(\) API:DeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["digits_data", "image_search"]
